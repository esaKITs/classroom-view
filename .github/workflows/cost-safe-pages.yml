name: Cost-safe prototype checks

on:
  workflow_dispatch:
  push:
    branches: [cost-safe-v1.5]
    paths:
      - "cost-safe/**"
      - "tests/test_cost_safe_contract.py"
      - ".github/workflows/cost-safe-pages.yml"
  pull_request:
    paths:
      - "cost-safe/**"
      - "tests/test_cost_safe_contract.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Cost-safety contract
        run: python -m pytest -q tests/test_cost_safe_contract.py
      - name: JavaScript syntax
        run: |
          node --check cost-safe/app.js
          node --check cost-safe/prototype.js
