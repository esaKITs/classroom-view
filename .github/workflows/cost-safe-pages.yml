name: Cost-safe prototype Pages

on:
  workflow_dispatch:
  push:
    branches: [cost-safe-v1.5]
    paths:
      - "cost-safe/**"
      - "tests/test_cost_safe_contract.py"
      - ".github/workflows/cost-safe-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "cost-safe-pages"
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_cost_safe_contract.py
      - run: |
          node --check cost-safe/app.js
          node --check cost-safe/prototype.js

  deploy:
    needs: contract
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cost-safe
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
