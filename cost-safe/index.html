<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom View v1.5 Cost-Safe</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:28px auto;padding:0 16px;background:#f5f5f7;color:#17171a}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}textarea{height:120px}button{padding:9px 12px;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.seat{display:inline-grid;place-items:center;width:54px;height:42px;border:1px solid #bbb;border-radius:7px;margin:3px}.off{visibility:hidden}.ok{color:#176b36}.warn{color:#9a5a00}video{width:100%;max-height:430px;background:#111}</style></head><body>
<h1>esaKITs / Classroom View <small>v1.5 cost-safe prototype</small></h1>
<div id="start" class="card"><label>Role</label><select id="role"><option value="teacher">Teacher</option><option value="student">Student</option></select><div id="studentFields"><input id="sid" placeholder="Student ID"><div class="row"><input id="surname" placeholder="姓（カタカナ）"><input id="given" placeholder="名（カタカナ）"></div><input id="seat" type="number" min="1" max="45" placeholder="Seat 1–45"></div><button id="begin">開始 / Start</button></div>
<div id="app" class="card hidden"><h2 id="who"></h2><div id="map"></div><div class="row"><button id="capture">学生：画面共有</button><button id="offer">教師：Offer作成</button><button id="answer">学生：Answer作成</button></div><label>この端末から送る接続情報</label><textarea id="local" readonly></textarea><label>相手端末から受け取った接続情報</label><textarea id="remote"></textarea><button id="apply">受信情報を適用</button><p id="status" class="warn">未接続</p><video id="video" autoplay playsinline muted></video></div>
<footer>© 2026 Tetsuya Esaki / esaKITs — Enhanced Smart AI Kits · Non-Commercial License</footer><script type="module" src="./app.js"></script></body></html>
